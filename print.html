<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Good Vibes POS</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font: 14px/1.3 system-ui, sans-serif; }
    #bar { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: #eee; border-bottom: 1px solid #bbb; }
    #bar button { font: inherit; padding: 3px 10px; }
    #status { flex: 1; }
    #status.ok { color: #060; } #status.bad { color: #a00; }
    #pos { flex: 1; width: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- Print shell: a normal top-level page, so it is allowed to use WebUSB.
       It shows the Apps Script POS in the frame below and prints the bytes the POS sends it. -->
  <div id="bar">
    <span id="status">Printer: checking...</span>
    <button id="btnConnect">Connect printer</button>
    <button id="btnUrl">POS address</button>
  </div>
  <iframe id="pos"></iframe>

<script>
const $ = id => document.getElementById(id);
const STAR = 0x0519;
const POS_URL_KEY = 'printShellPosUrl';
// Only Apps Script pages may send print jobs (e.g. https://n-abc123-0lu-script.googleusercontent.com)
const GAS_ORIGIN = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;

let device = null, epOut = null;

function setStatus(text, ok) {
  $('status').textContent = 'Printer: ' + text;
  $('status').className = ok ? 'ok' : 'bad';
  console.log('[print shell] ' + text);
}

// ---------------- POS address (remembered on this Chromebook) ----------------
function loadPos() {
  let url = new URLSearchParams(location.search).get('pos');
  try { url = url || localStorage.getItem(POS_URL_KEY); } catch (e) { /* storage blocked */ }
  if (!url) return askPosUrl();
  $('pos').src = url;
}
function askPosUrl() {
  let current = '';
  try { current = localStorage.getItem(POS_URL_KEY) || ''; } catch (e) { /* storage blocked */ }
  const url = (prompt('Paste the POS web app address (https://script.google.com/macros/s/.../exec):', current) || '').trim();
  if (!/^https:\/\/script\.google\.com\//.test(url)) { if (url) alert('That is not a script.google.com address.'); return; }
  try { localStorage.setItem(POS_URL_KEY, url); } catch (e) { /* not remembered */ }
  $('pos').src = url;
}

// ---------------- Printer connection ----------------
async function openPrinter(d) {
  if (!d.opened) await d.open();
  if (!d.configuration) await d.selectConfiguration(1);
  const iface = d.configuration.interfaces.find(i => i.alternates[0].interfaceClass === 7);
  if (!iface.claimed) await d.claimInterface(iface.interfaceNumber);
  epOut = iface.alternates[0].endpoints.find(e => e.direction === 'out').endpointNumber;
  device = d;
  setStatus('connected (' + d.productName + ')', true);
}

async function autoConnect() {
  if (!navigator.usb) { setStatus('WebUSB not available in this browser', false); return; }
  const approved = (await navigator.usb.getDevices()).filter(d => d.vendorId === STAR);
  if (!approved.length) { setStatus('not connected - click "Connect printer" once', false); return; }
  try { await openPrinter(approved[0]); }
  catch (e) { setStatus('found but could not open (open in another tab?) ' + e.message, false); }
}

$('btnConnect').onclick = async () => {
  try { await openPrinter(await navigator.usb.requestDevice({ filters: [{ vendorId: STAR }] })); }
  catch (e) { if (e.name !== 'NotFoundError') setStatus('connect failed: ' + e.message, false); }
};
$('btnUrl').onclick = askPosUrl;

if (navigator.usb) {
  navigator.usb.addEventListener('disconnect', e => {
    if (e.device !== device) return;
    device = null; epOut = null;
    setStatus('disconnected - waiting for printer...', false);
  });
  navigator.usb.addEventListener('connect', e => {
    if (device || e.device.vendorId !== STAR) return;
    openPrinter(e.device).catch(err => setStatus('reconnect failed: ' + err.message, false));
  });
}

async function sendBytes(bytes) {
  if (!device) throw new Error('Printer not connected');
  for (let i = 0; i < bytes.length; i += 4096) {
    const r = await device.transferOut(epOut, bytes.slice(i, i + 4096));
    if (r.status !== 'ok') throw new Error('USB status ' + r.status);
  }
}

// ---------------- Messages from the POS ----------------
// POS sends: { type: 'star-printer', id, cmd: 'status' }  or  { type: 'star-printer', id, cmd: 'send', bytes: Uint8Array }
// Shell answers: { type: 'star-printer-reply', id, ok, connected, error }
let queue = Promise.resolve();   // one job at a time, in order
window.addEventListener('message', ev => {
  const m = ev.data;
  if (!m || m.type !== 'star-printer' || !GAS_ORIGIN.test(ev.origin)) return;
  const reply = extra => ev.source.postMessage(Object.assign({ type: 'star-printer-reply', id: m.id, connected: !!device }, extra), ev.origin);
  if (m.cmd === 'status') { reply({ ok: true, printer: device ? device.productName : null }); return; }
  if (m.cmd === 'send') {
    queue = queue
      .then(() => sendBytes(new Uint8Array(m.bytes)))
      .then(() => reply({ ok: true }), err => reply({ ok: false, error: err.message }));
  }
});

loadPos();
autoConnect().catch(e => setStatus('error: ' + e.message, false));
</script>
</body>
</html>
